# Render blueprint: one service.
#
# The web process also runs the queue worker and both cron sweeps, because two
# always-on services cost twice as much as one and both halves of this app are
# pure async I/O. See app/queue/embedded.py for why that is safe and what it
# costs, and the end of docs/deploy.md for how to split them when it stops
# being the right trade.
#
# Not here, on purpose:
#   Postgres - Supabase. `DATABASE_URL` is a secret you paste in once.
#   Redis    - Upstash's free tier. `REDIS_URL` likewise.
# Both are free at pilot scale, which puts the whole platform at ~$7/month.
#
# Create with: Render dashboard -> New -> Blueprint -> point at this repo.
# Every `sync: false` value is prompted for on that first create and never
# again; change them afterwards in the service's Environment tab.

services:
  - type: web
    name: frontdesk
    runtime: docker
    dockerfilePath: ./Dockerfile
    # The cheapest always-on plan. NOT `free`: a free service sleeps after
    # inactivity and takes tens of seconds to wake, and Twilio times out long
    # before that - the first customer text of the morning would be lost.
    plan: 0.5c-512mb
    region: ohio
    healthCheckPath: /health
    # Migrations run once per deploy, before any new instance takes traffic.
    preDeployCommand: python -m alembic upgrade head
    # --proxy-headers is load-bearing: behind Render's proxy every request
    # otherwise appears to come from the proxy's own address, and the signup
    # form's per-address rate limit would see all visitors as one.
    dockerCommand: >-
      python -m uvicorn app.main:app
      --host 0.0.0.0 --port $PORT
      --proxy-headers --forwarded-allow-ips='*'
    autoDeployTrigger: commit
    envVars:
      # This is what starts the queue worker inside the web process.
      - key: RUN_WORKER_IN_PROCESS
        value: "true"
      # One instance. The tenant-router config cache and the admin login
      # throttle are both in-process, and so is the worker - a second instance
      # would run a second copy of all three, including the cron sweeps.
      # Scaling out means splitting the worker out first.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PYTHONPATH
        value: /app
      - key: LOG_LEVEL
        value: INFO
      - key: AI_ENABLED
        value: "true"
      # Twilio signatures are verified against this exact string, not against
      # the incoming request, so it must match what Twilio is configured with:
      # https, no trailing slash.
      - key: PUBLIC_BASE_URL
        sync: false
      # Supabase: the *session pooler* string, port 5432, with the scheme
      # changed to postgresql+asyncpg://. See docs/deploy.md.
      - key: DATABASE_URL
        sync: false
      # Upstash: the rediss:// URL from the database's details page.
      - key: REDIS_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VALIDATE_SIGNATURE
        value: "true"
      # The whole service-account JSON pasted in - a file path is no use on a
      # platform with no persistent disk.
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      # Retell (voice). Blank until a number is pointed at us; the rest of the
      # app runs fine without it, and /health says which half is missing.
      - key: RETELL_API_KEY
        sync: false
      # The secret in the custom-LLM websocket path. Generate once with
      #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      # and keep it secret: it is half of what stops a stranger opening a
      # bridge and talking to a shop's customers.
      - key: RETELL_WS_SECRET
        sync: false
      - key: RETELL_AGENT_ID
        sync: false
      - key: RETELL_VOICE_ID
        sync: false
      - key: RETELL_VALIDATE_SIGNATURE
        value: "true"
