# Render auto-deploys on commit, so this is the only thing between a red test
# run and production. Keep it fast and keep it required on the default branch.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Postgres, not SQLite: the schema uses JSONB, ARRAY and native enums.
        image: postgres:16
        env:
          POSTGRES_USER: frontdesk
          POSTGRES_PASSWORD: frontdesk
          POSTGRES_DB: frontdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_PG_PORT: "5432"
      # No real key. Every test either stubs Claude or replays a recorded
      # response shape, so the suite must pass without one - if this ever
      # starts failing for want of a key, a test has grown a live API call.
      ANTHROPIC_API_KEY: ""
      TWILIO_VALIDATE_SIGNATURE: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Check the models and the migrations agree
        run: |
          python -m alembic upgrade head
          python -m alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://frontdesk:frontdesk@localhost:5432/frontdesk

      - name: Check the migrations reverse
        run: python -m alembic downgrade base
        env:
          DATABASE_URL: postgresql+asyncpg://frontdesk:frontdesk@localhost:5432/frontdesk

      - name: Test
        run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The image is what actually runs in production, and the failure it
      # catches is a quiet one: a missing template 500s the console's first
      # page while the API looks fine.
      - name: Build the image
        run: docker build -t frontdesk:ci .
      - name: It must start and serve its own stylesheet
        run: |
          docker run -d --name ci -p 8000:8000 \
            -e DATABASE_URL=postgresql+asyncpg://nobody@127.0.0.1:1/none \
            -e ANTHROPIC_API_KEY=ci frontdesk:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            [ -n "$code" ] && [ "$code" != "000" ] && break
            sleep 1
          done
          # 503 is the expected answer with no database, and proves the app
          # booted and its health check ran.
          test "$code" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/web-static/app.css)" = "200"
          docker rm -f ci
